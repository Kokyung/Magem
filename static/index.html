<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magem</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/static/logo.png" width="26" height="26" alt="">
    <span>Magem</span>
  </div>
  <div class="search-wrap">
  <button class="ghost icon-only" id="homeBtn" data-i18n-title="home">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 9.8V19h4v-5h3v5h4V9.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <form class="search" id="searchForm" autocomplete="off">
    <div class="query-image hidden" id="queryImage">
      <img id="queryImageThumb" alt="">
      <button type="button" id="clearImage" data-i18n-title="search.clearImage">×</button>
    </div>
    <input id="q" type="search" role="combobox" aria-controls="recent" aria-autocomplete="list">
    <label class="icon-btn" data-i18n-title="search.byImage">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="m4 17 5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </label>
    <div class="recent hidden" id="recent" role="listbox" data-i18n-label="recent.title"></div>
  </form>
  </div>
  <button class="ghost icon-only" id="openFolders" data-i18n-title="top.folders">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>
  <button class="ghost icon-only hidden" id="openDownloads" data-i18n-title="top.downloads">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="ghost icon-only" id="openSettings" data-i18n-title="top.settings">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
</header>

<div class="toolbar">
  <div class="toolbar-filters">
  <div class="seg" id="typeFilter" role="tablist">
    <button data-type="all" class="on" data-i18n="filter.all"></button>
    <button data-type="image" data-i18n="filter.photos"></button>
    <button data-type="video" data-i18n="filter.videos"></button>
  </div>
  <label class="toggle" data-i18n-title="audio.tip">
    <input type="checkbox" id="useAudio" checked> <span data-i18n="audio.label"></span>
  </label>
  <div class="date-filter" id="dateFilter">
    <button class="date-btn" id="dateBtn" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n-title="date.pick">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span id="dateLabel"></span>
    </button>
    <div class="date-pop hidden" id="datePop" role="dialog" data-i18n-label="date.pick">
      <div class="date-presets" id="datePresets"></div>
      <div class="date-cal">
        <div class="date-head">
          <button class="icon-btn" id="datePrev" type="button" data-i18n-title="date.prevMonth">‹</button>
          <span class="date-ym"><select id="dateYear"></select><select id="dateMonth"></select></span>
          <button class="icon-btn" id="dateNext" type="button" data-i18n-title="date.nextMonth">›</button>
        </div>
        <div class="date-grid" id="dateGrid" role="grid"></div>
        <p class="date-summary" id="dateSummary"></p>
        <div class="date-foot">
          <button class="ghost" id="dateReset" type="button" data-i18n="date.clear"></button>
          <span class="date-foot-gap"></span>
          <button class="ghost" id="dateCancel" type="button" data-i18n="backup.cancel"></button>
          <button class="primary" id="dateApply" type="button" data-i18n="date.apply"></button>
        </div>
      </div>
    </div>
    <button class="icon-btn date-clear hidden" id="dateClear" type="button" data-i18n-label="date.clear">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  </div>
  <div class="status-bar">
    <span class="status-short" id="statusShort"></span>
    <button class="icon-btn index-toggle hidden" id="indexToggle" type="button">
      <svg class="ring" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" pathLength="100"/></svg>
      <svg class="play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      <svg class="pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
    </button>
    <div class="status-pop" id="status"></div>
  </div>
</div>
<div class="progress hidden" id="progress"><div id="progressBar"></div></div>

<main>
  <section class="boot" id="bootSkeleton" aria-hidden="true">
    <span class="sk sk-line"></span>
    <div class="chips"><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
    <div class="browser">
      <div class="browser-head"><span class="sk sk-line"></span></div>
      <div id="bootGrid"></div>
    </div>
  </section>
  <section class="empty hidden" id="welcome">
    <h1 data-i18n="welcome.title"></h1>
    <p data-i18n-html="welcome.body"></p>
    <button class="primary" id="welcomeAdd" data-i18n="welcome.add"></button>
  </section>
  <section class="empty hidden" id="hint">
    <p class="muted" data-i18n="hint.text"></p>
    <div class="chips" id="examples"></div>
  </section>
  <section class="browser hidden" id="browser">
    <div class="browser-head">
      <h2 data-i18n="browser.title"></h2>
      <nav class="crumbs" id="crumbs"></nav>
      <button class="select-all hidden" id="browseSelectAll" type="button" role="checkbox"><span class="round-check"></span><span data-i18n="select.all"></span></button>
      <button class="select-toggle icon-only hidden" id="browseSelectMode" type="button" aria-pressed="false" data-i18n-title="select.mode">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>
        </svg>
      </button>
      <div class="sort">
        <label class="select-field">
          <span data-i18n="browser.sortBy"></span>
          <select id="sortKey">
            <option value="name" data-i18n="sort.name"></option>
            <option value="mtime" data-i18n="sort.modified"></option>
          </select>
        </label>
        <button class="icon-btn sort-dir" id="sortDir" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path class="asc" d="M3 6h5M3 12h8M3 18h11M19 5v14M16 16l3 3 3-3"/>
            <path class="desc" d="M3 6h11M3 12h8M3 18h5M19 19V5M16 8l3-3 3 3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="hidden" id="albumRow">
      <h3 class="album-head" data-i18n="albums.title"></h3>
      <div class="dir-list album-list" id="albumList"></div>
    </div>
    <h3 class="album-head hidden" id="localHead" data-i18n="browser.local"></h3>
    <div class="dir-list" id="dirList"></div>
    <div class="grid" id="browseGrid"></div>
    <div class="more" id="browseMore"></div>
    <div class="browse-foot">
      <p class="muted small" id="browseNote"></p>
      <button class="ghost small hidden" id="albumCleanup" type="button" data-i18n="album.removeMissing"></button>
    </div>
  </section>
  <div class="results-bar">
    <div class="summary" id="summary"></div>
    <button class="select-toggle hidden" id="resultsSelectMode" type="button" aria-pressed="false" data-i18n="select.mode"></button>
    <button class="select-all hidden" id="resultsSelectAll" type="button" role="checkbox"><span class="round-check"></span><span data-i18n="select.all"></span></button>
  </div>
  <div id="results"></div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 data-i18n="drawer.title"></h2>
    <div class="seg view-toggle" id="folderView">
      <button type="button" data-view="grid" aria-pressed="false" data-i18n-title="view.grid">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
      </button>
      <button class="on" type="button" data-view="list" aria-pressed="true" data-i18n-title="view.list">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <button class="icon-btn close-drawer" data-i18n-title="close">×</button>
  </div>
  <div class="drawer-body">
    <button class="primary wide" id="pickFolder" data-i18n="drawer.pick"></button>
    <form id="pathForm" class="path-form">
      <input id="pathInput" data-i18n-placeholder="drawer.pathPlaceholder">
      <button class="ghost" data-i18n="drawer.add"></button>
    </form>
    <ul class="folders folder-grid as-list" id="folders"></ul>
    <div class="sub-head">
      <h3 data-i18n="excluded.title"></h3>
      <button class="ghost" id="pickExcluded" data-i18n="excluded.pick"></button>
    </div>
    <p class="muted small sub-note" data-i18n="excluded.note"></p>
    <ul class="folders folder-grid as-list" id="excludedList"></ul>
    <p class="muted small" id="statsLine"></p>
    <details id="errorsBox" class="hidden">
      <summary data-i18n="errors.title"></summary>
      <div class="errors-head">
        <p class="muted small" data-i18n="errors.note"></p>
        <button class="ghost" id="clearErrors" data-i18n="errors.clearAll"></button>
      </div>
      <ul id="errors" class="errors"></ul>
    </details>
  </div>
</aside>
<aside class="drawer" id="settings" aria-hidden="true">
  <div class="drawer-head">
    <h2 data-i18n="settings.title"></h2>
    <button class="icon-btn close-drawer" data-i18n-title="close">×</button>
  </div>
  <div class="drawer-body">
    <label class="setting">
      <span data-i18n="settings.language"></span>
      <select id="langSelect"></select>
    </label>
    <label class="setting">
      <span data-i18n="settings.theme"></span>
      <select id="themeSelect">
        <option value="system" data-i18n="theme.system"></option>
        <option value="light" data-i18n="theme.light"></option>
        <option value="dark" data-i18n="theme.dark"></option>
      </select>
    </label>
    <label class="setting-check">
      <input type="checkbox" id="autoplayCheck" checked> <span data-i18n="settings.videoAutoplay"></span>
    </label>
    <div class="hidden" id="startupRow">
      <label class="setting-check">
        <input type="checkbox" id="startupCheck"> <span data-i18n="settings.startup"></span>
      </label>
      <p class="muted small setting-note hidden" id="startupNote" data-i18n="settings.startupUnavailable"></p>
      <div class="setting-sub hidden" id="startHiddenRow">
        <label class="setting-check">
          <input type="checkbox" id="startHiddenCheck" checked> <span data-i18n="settings.startHidden"></span>
        </label>
        <p class="muted small setting-note" data-i18n="settings.startHiddenNote"></p>
      </div>
    </div>
    <div class="hidden" id="backgroundRow">
      <label class="setting-check">
        <input type="checkbox" id="backgroundCheck"> <span data-i18n="settings.background"></span>
      </label>
      <p class="muted small setting-note" data-i18n="settings.backgroundNote"></p>
    </div>
    <div class="setting">
      <span data-i18n="settings.performance"></span>
      <div class="setting-group" role="radiogroup" aria-labelledby="perfLabel">
        <p class="small" id="perfLabel" data-i18n="perf.indexing"></p>
        <label class="setting-check"><input type="radio" name="perfMode" value="eco"> <span data-i18n="perf.eco"></span></label>
        <label class="setting-check"><input type="radio" name="perfMode" value="balanced" checked> <span data-i18n="perf.balanced"></span></label>
        <label class="setting-check"><input type="radio" name="perfMode" value="max"> <span data-i18n="perf.max"></span></label>
      </div>
      <div class="setting-group" role="radiogroup" aria-labelledby="perfBackgroundLabel">
        <p class="small" id="perfBackgroundLabel" data-i18n="perf.background"></p>
        <label class="setting-check"><input type="radio" name="perfBackground" value="eco" checked> <span data-i18n="perf.eco"></span></label>
        <label class="setting-check"><input type="radio" name="perfBackground" value="balanced"> <span data-i18n="perf.balanced"></span></label>
        <label class="setting-check"><input type="radio" name="perfBackground" value="max"> <span data-i18n="perf.max"></span></label>
      </div>
      <div class="setting-group"><label class="setting-check"><input type="checkbox" id="perfBattery" checked> <span data-i18n="perf.pauseOnBattery"></span></label></div>
    </div>
    <div class="setting">
      <span data-i18n="backup.title"></span>
      <div class="row">
        <button class="ghost" id="backupBtn" type="button" data-i18n="backup.backup"></button>
        <button class="ghost" id="restoreBtn" type="button" data-i18n="backup.restore"></button>
      </div>
      <p class="muted small backup-note" data-i18n="backup.note"></p>
    </div>
    <div class="setting" id="experimentalRow">
      <span data-i18n="settings.experimental"></span>
      <div class="setting-group">
        <label class="setting-check">
          <input type="checkbox" id="webDownloadCheck"> <span data-i18n="dl.title"></span>
        </label>
        <p class="muted small setting-note" data-i18n="settings.webDownloadNote"></p>
      </div>
    </div>
  </div>
</aside>
<aside class="drawer" id="downloads" aria-hidden="true">
  <div class="drawer-head">
    <h2 data-i18n="dl.title"></h2>
    <button class="icon-btn close-drawer" data-i18n-title="close">×</button>
  </div>
  <div class="drawer-body">
    <form id="dlForm" class="dl-form">
      <div class="sub-head">
        <h3 data-i18n="dl.urlsTitle"></h3>
        <button class="icon-btn" id="dlAddUrl" type="button" data-i18n-title="dl.addUrl">+</button>
      </div>
      <ul class="dl-urls" id="dlUrls"></ul>
      <p class="muted small hidden" id="dlNoFolder" data-i18n="dl.noFolder"></p>
      <button class="primary wide" id="dlStart" data-i18n="dl.start"></button>
      <label class="setting-check" data-i18n-title="dl.postFolderTip">
        <input type="checkbox" id="dlPostFolder" checked> <span data-i18n="dl.postFolder"></span>
      </label>
    </form>
    <p class="muted small hidden" id="dlTool"></p>
    <div class="sub-head">
      <h3 data-i18n="dl.listTitle"></h3>
      <button class="icon-btn" id="dlClearDone" type="button" data-i18n-title="dl.clearDone">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h10M4 18h6M15.5 15.5l5 5M20.5 15.5l-5 5"/></svg>
      </button>
    </div>
    <ul class="folders dl-list" id="dlList"></ul>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true">
  <div class="viewer-stage">
    <div class="viewer-media" id="viewerMedia"></div>
    <div class="viewer-zoom hidden" id="vZoom">
      <button class="icon-btn" id="vZoomOut" type="button" data-i18n-title="viewer.zoomOut">−</button>
      <button class="zoom-level" id="vZoomReset" type="button" data-i18n-title="viewer.zoomReset">100%</button>
      <button class="icon-btn" id="vZoomIn" type="button" data-i18n-title="viewer.zoomIn">+</button>
    </div>
    <button class="viewer-fs" id="vFullscreen" type="button" data-i18n-title="viewer.fullscreen">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    </button>
    <button class="viewer-step prev" id="vPrev" type="button" data-i18n-title="viewer.prev">‹</button>
    <button class="viewer-step next" id="vNext" type="button" data-i18n-title="viewer.next">›</button>
    <div class="viewer-flash" id="vFlash" aria-hidden="true">
      <svg class="flash-play" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      <svg class="flash-pause" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </div>
    <div class="viewer-toast" id="vToast"></div>
  </div>
  <div class="viewer-side">
    <button class="icon-btn close" id="closeViewer" data-i18n-title="viewer.closeEsc">×</button>
    <h3 id="vName"></h3>
    <p class="muted small path" id="vPath"></p>
    <p class="small" id="vScore"></p>
    <div id="vText" class="hidden"></div>
    <div id="vMoments"></div>
    <div class="col">
      <button class="ghost fav-btn" id="vFav" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span id="vFavLabel"></span>
      </button>
      <button class="ghost" id="vSimilar" data-i18n="viewer.similar"></button>
      <button class="ghost" id="vReveal"></button>
      <button class="ghost" id="vOpen" data-i18n="viewer.open"></button>
    </div>
    <p class="muted small" data-i18n="viewer.nav"></p>
  </div>
</div>

<div class="dropzone hidden" id="dropzone"><div data-i18n="dropzone"></div></div>
<div class="toast" id="toast"></div>
<div class="context-menu hidden" id="contextMenu" role="menu"></div>
<div class="modal hidden" id="jobModal" role="dialog" aria-modal="true" aria-labelledby="jobTitle">
  <div class="modal-card">
    <div class="spinner" id="jobSpinner" aria-hidden="true"></div>
    <h3 id="jobTitle"></h3>
    <p class="muted small" id="jobDetail"></p>
    <div class="row modal-actions">
      <button class="ghost hidden" id="jobReveal" type="button"></button>
      <button class="ghost hidden" id="jobCancel" type="button" data-i18n="backup.cancel"></button>
      <button class="primary hidden" id="jobClose" type="button" data-i18n="close"></button>
    </div>
  </div>
</div>
<div class="modal hidden" id="confirmModal" role="alertdialog" aria-modal="true" aria-describedby="confirmText">
  <div class="modal-card">
    <p id="confirmText"></p>
    <input class="modal-input hidden" id="confirmInput" type="text" maxlength="100" autocomplete="off">
    <div class="row modal-actions">
      <button class="ghost" id="confirmNo" type="button" data-i18n="backup.cancel"></button>
      <button class="primary" id="confirmYes" type="button"></button>
    </div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
